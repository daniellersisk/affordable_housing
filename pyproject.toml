[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that exercise application code with real infrastructure dependencies",
  "e2e: tests that exercise end-to-end HTTP flows against the running stack",
  "contract: tests that verify API status codes, response schemas, and error shapes",
]
