name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build API image
        run: docker compose build api

      - name: Run Ruff
        run: docker compose run --rm --no-deps api ruff check .

      - name: Apply migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Verify schema at head
        run: docker compose run --rm api alembic current

      - name: Check for uncommitted model changes
        run: docker compose run --rm api alembic check

      - name: Run tests
        run: docker compose run --rm api pytest -q
