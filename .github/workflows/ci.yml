name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          # CI needs auth enabled but must not rely on secrets distribution.
          # Provide a dummy local-only write key so settings validation passes.
          echo "WRITE_API_KEY=ci-test-key" >> .env

      - name: Build images
        run: docker compose build

      - name: Run Ruff
        run: docker compose run --rm --no-deps api ruff check .

  tests:
    name: Unit/contract/integration tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          # CI needs auth enabled but must not rely on secrets distribution.
          # Provide a dummy local-only write key so settings validation passes.
          echo "WRITE_API_KEY=ci-test-key" >> .env

      - name: Build images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database to be healthy
        run: |
          for i in $(seq 1 30); do
            docker compose exec db pg_isready -U postgres && break || sleep 2
          done

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Verify schema at head
        run: docker compose run --rm --no-deps api alembic current

      - name: Check for uncommitted model changes
        run: docker compose run --rm --no-deps api alembic check

      - name: Run unit/contract/integration tests (non-e2e)
        run: docker compose run --rm --no-deps api pytest -q -m "not e2e"

  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "WRITE_API_KEY=ci-test-key" >> .env

      - name: Build images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database to be healthy
        run: |
          for i in $(seq 1 30); do
            docker compose exec db pg_isready -U postgres && break || sleep 2
          done

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Run system tests (e2e)
        run: docker compose run --rm --no-deps api pytest -q -m e2e
